name: Prepare licensed photography
on:
  push:
    paths:
      - '.github/workflows/prepare-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Fetch and optimize licensed illustrative photographs
        shell: python
        run: |
          import hashlib, io, json, pathlib, urllib.request
          from PIL import Image, ImageOps
          root = pathlib.Path('photo-bundle'); root.mkdir(exist_ok=True)
          photos = [
            ('steak', 'cpkPJ-U9eUM', 'Emerson Vieira', 'cooked-sliced-meat', 'photo-1558030006-450675393462'),
            ('breakfast', 'TkzdkVn1AyA', 'Mae Mu', 'pancakes-with-syrup', 'photo-1554520735-0a6b8b6ce8b7'),
            ('burger', 'BDG_Uu9Dguk', 'Chantel', 'burger-with-fries-on-stainless-steel-round-plate', 'photo-1627781962452-6b468257844b'),
            ('coffee', 'N3btvQ51dL0', 'Nathan Dumlao', 'person-pouring-black-coffee-in-white-ceramic-mug-placed-on-brown-wooden-table-during-daytime', 'photo-1522012188892-24beb302783d'),
            ('lounge', 'WCm4dFvZnMM', 'Louis Hansel', 'person-holding-handle-of-faucet', 'photo-1555658636-6e4a36218be7')
          ]
          manifest = []
          for name, photo_id, photographer, slug, cdn_id in photos:
            source = f'https://unsplash.com/photos/{slug}-{photo_id}'
            url = f'https://images.unsplash.com/{cdn_id}?auto=format&fit=max&w=1800&q=85'
            request = urllib.request.Request(url, headers={'User-Agent': 'MeridysDesignPreview/1.0'})
            with urllib.request.urlopen(request, timeout=60) as response:
              raw = response.read()
            image = ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
            entry = {'name': name, 'photo_id': photo_id, 'photographer': photographer, 'source': source,
                     'license': 'https://unsplash.com/license', 'status': 'licensed-illustrative-not-meridys',
                     'download_url': url, 'license_checked': '2026-09-07',
                     'source_sha256': hashlib.sha256(raw).hexdigest(), 'variants': []}
            for width in (480, 900, 1600):
              thumb = image.copy()
              thumb.thumbnail((width, 3000), Image.Resampling.LANCZOS)
              for ext, options in [('webp', {'quality': 80, 'method': 6}), ('jpg', {'quality': 82, 'optimize': True, 'progressive': True})]:
                dest = root / f'{name}-{width}.{ext}'
                thumb.save(dest, **options)
                entry['variants'].append({'file': dest.name, 'width': thumb.width, 'height': thumb.height, 'bytes': dest.stat().st_size, 'sha256': hashlib.sha256(dest.read_bytes()).hexdigest()})
            manifest.append(entry)
            print(f'{name}: {photographer}, {image.width}x{image.height}')
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
      - name: Commit optimized photographs and provenance
        run: |
          mkdir -p public/assets/images
          cp photo-bundle/* public/assets/images/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/images
          if ! git diff --cached --quiet; then
            git commit -m 'assets: add optimized licensed illustrative photography with provenance'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: licensed-photo-bundle
          path: photo-bundle/
          retention-days: 14
