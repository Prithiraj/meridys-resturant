name: Prepare licensed photography
on:
  push:
    paths:
      - '.github/workflows/prepare-photos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Fetch and optimize licensed illustrative photographs
        shell: python
        run: |
          import hashlib, html, io, json, pathlib, re, time, urllib.request
          from PIL import Image, ImageOps
          root = pathlib.Path('photo-bundle'); root.mkdir(exist_ok=True)
          photos = [
            ('steak', 'cpkPJ-U9eUM', 'Emerson Vieira', 'cooked-sliced-meat'),
            ('breakfast', 'TkzdkVn1AyA', 'Mae Mu', 'pancakes-with-syrup'),
            ('burger', 'BDG_Uu9Dguk', 'Chantel', 'burger-with-fries-on-stainless-steel-round-plate'),
            ('coffee', 'N3btvQ51dL0', 'Nathan Dumlao', 'person-pouring-black-coffee-in-white-ceramic-mug-placed-on-brown-wooden-table-during-daytime'),
            ('lounge', 'WCm4dFvZnMM', 'Louis Hansel', 'person-holding-handle-of-faucet')
          ]
          manifest = []
          def get(url):
            request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (compatible; MeridysDesignPreview/1.0)'})
            with urllib.request.urlopen(request, timeout=45) as response:
              return response.read(), response.url
          for name, photo_id, photographer, slug in photos:
            source = f'https://unsplash.com/photos/{slug}-{photo_id}'
            original = None
            for attempt in range(3):
              try:
                raw, resolved = get(f'https://unsplash.com/photos/{photo_id}/download?force=true&w=1800')
                image = Image.open(io.BytesIO(raw))
                original = raw
                break
              except Exception as error:
                print(f'{name}: download attempt {attempt+1}: {error}')
                try:
                  page, _ = get(source)
                  content = page.decode('utf-8')
                  match = re.search(r'<meta[^>]+property="og:image"[^>]+content="([^"]+)"', content)
                  if not match:
                    match = re.search(r'<meta[^>]+content="([^"]+)"[^>]+property="og:image"', content)
                  if not match:
                    raise RuntimeError('No Open Graph image found')
                  direct = html.unescape(match.group(1)).split('?')[0] + '?auto=format&fit=max&w=1800&q=85'
                  raw, resolved = get(direct)
                  image = Image.open(io.BytesIO(raw))
                  original = raw
                  break
                except Exception as nested:
                  print(f'{name}: page fallback: {nested}')
                  time.sleep(3)
            if original is None:
              raise RuntimeError(f'Cannot obtain licensed photograph {photo_id}')
            image = ImageOps.exif_transpose(image).convert('RGB')
            entry = {'name': name, 'photo_id': photo_id, 'photographer': photographer, 'source': source,
                     'license': 'https://unsplash.com/license', 'status': 'licensed-illustrative-not-meridys',
                     'download_url': resolved, 'source_sha256': hashlib.sha256(original).hexdigest(), 'variants': []}
            for width in (480, 900, 1600):
              thumb = image.copy()
              thumb.thumbnail((width, 3000), Image.Resampling.LANCZOS)
              for ext, options in [('webp', {'quality': 80, 'method': 6}), ('jpg', {'quality': 82, 'optimize': True, 'progressive': True})]:
                dest = root / f'{name}-{width}.{ext}'
                thumb.save(dest, **options)
                entry['variants'].append({'file': dest.name, 'width': thumb.width, 'height': thumb.height, 'bytes': dest.stat().st_size, 'sha256': hashlib.sha256(dest.read_bytes()).hexdigest()})
            manifest.append(entry)
            print(f'{name}: {photographer}, {image.width}x{image.height}; source={resolved}')
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: licensed-photo-bundle
          path: photo-bundle/
          retention-days: 14
